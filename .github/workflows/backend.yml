name: Backend checks
on:
  push:
    paths: ['Backend/**', 'Frontend/**', 'docker-compose.yml', '.github/workflows/backend.yml']
  pull_request:
    paths: ['Backend/**', 'Frontend/**', 'docker-compose.yml', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  postgres-tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kayipqr_test
          POSTGRES_PASSWORD: isolated_ci_password
          POSTGRES_DB: kayipqr_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kayipqr_test -d kayipqr_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://kayipqr_test:isolated_ci_password@127.0.0.1:5432/kayipqr_test
      TEST_DATABASE_URL: postgresql+asyncpg://kayipqr_test:isolated_ci_password@127.0.0.1:5432/kayipqr_test
      SMTP_HOST: ''
      SMTP_USER: ''
      SMTP_PASSWORD: ''
      UPLOAD_DIR: /tmp/kayipqr-ci-uploads
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Backend/requirements.lock
      - run: python -m pip install --upgrade pip==26.2.1
      - run: python -m pip install -r requirements.lock -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m app.migrate
      - run: python -m alembic check
      - run: python -m pytest tests -q
      - name: Redis-free serverless HTTP smoke across two processes
        run: |
          export SERVERLESS_MODE=true SINGLE_INSTANCE_MODE=false RUN_BACKGROUND_TASKS=false STORAGE_BACKEND=database REDIS_URL=""
          export SECRET_KEY="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          PORT=8011 python -m app.entrypoint > /tmp/kayipqr-vercel-one.log 2>&1 &
          first=$!
          PORT=8012 python -m app.entrypoint > /tmp/kayipqr-vercel-two.log 2>&1 &
          second=$!
          trap 'kill "$first" "$second" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8011/ready && curl --fail --silent http://127.0.0.1:8012/ready; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/kayipqr-vercel-one.log /tmp/kayipqr-vercel-two.log; exit 1; fi
          python scripts/load_smoke.py --transport polling --base-url http://127.0.0.1:8011 --base-url http://127.0.0.1:8012 --requests 40 --concurrency 4
      - name: Two-replica functional and bounded load smoke
        run: |
          export REDIS_URL="$TEST_REDIS_URL"
          export RUN_BACKGROUND_TASKS=false
          export SECRET_KEY="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          PORT=8001 python -m app.entrypoint > /tmp/kayipqr-one.log 2>&1 &
          first=$!
          PORT=8002 python -m app.entrypoint > /tmp/kayipqr-two.log 2>&1 &
          second=$!
          trap 'kill "$first" "$second" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8001/ready && curl --fail --silent http://127.0.0.1:8002/ready; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/kayipqr-one.log /tmp/kayipqr-two.log; exit 1; fi
          python scripts/load_smoke.py --base-url http://127.0.0.1:8001 --base-url http://127.0.0.1:8002 --requests 80 --concurrency 8 --max-p95-ms 1500
      - run: python -m alembic downgrade 060074e17972 && python -m alembic upgrade head && python -m alembic check
      - run: docker build -t kayipqr-backend-ci .
      - run: python -m pip install pip-audit && python -m pip_audit -r requirements.lock
  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: node tests/api-pagination.cjs
      - run: node tests/visible-polling.cjs
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run build
      - name: Frontend container startup and Railway PORT
        run: |
          docker build -t kayipqr-frontend-ci .
          docker run -d --name kayipqr-frontend-test -e PORT=8080 -p 127.0.0.1:8080:8080 kayipqr-frontend-ci
          trap 'docker rm -f kayipqr-frontend-test >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/ > /dev/null; then exit 0; fi
            sleep 1
          done
          docker logs kayipqr-frontend-test
          exit 1
