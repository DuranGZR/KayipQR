services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kayipqr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-kayipqr_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kayipqr} -d ${POSTGRES_DB:-kayipqr_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      RUN_MIGRATIONS: "true"
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?Set a random SECRET_KEY}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kayipqr}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kayipqr_prod}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://kayipqr.com}
      FRONTEND_URL: ${FRONTEND_URL:-https://kayipqr.com}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-["https://kayipqr.com","https://www.kayipqr.com"]}
      ENABLE_EXTERNAL_GEOIP: ${ENABLE_EXTERNAL_GEOIP:-False}
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-https://api.kayipqr.com}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-["127.0.0.1","::1"]}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_TLS: ${SMTP_TLS:-true}
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD}
      EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL:-info@kayipqr.com}
      EMAILS_FROM_NAME: ${EMAILS_FROM_NAME:-KayıpQR}
      MAX_STORAGE_SIZE_MB: ${MAX_STORAGE_SIZE_MB:-1024}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.kayipqr.com/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://api.kayipqr.com}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://kayipqr.com}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.kayipqr.com/api/v1}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://kayipqr.com}
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres_data:
  uploads_data:
